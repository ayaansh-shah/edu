<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Notebook</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(circle at 50% 20%,#eef7ff 0,#dce9f4 35%,#c5d5e2 100%);display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;gap:8px;font-family:sans-serif}
.lbl{font-size:9px;color:#52657a;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.phone{width:300px;height:600px;border-radius:42px;border:7px solid #d8e2ea;overflow:hidden;background:#dcebf3;box-shadow:20px 25px 45px rgba(48,72,91,.25),-12px -12px 30px rgba(255,255,255,.9),inset 0 0 0 2px rgba(255,255,255,.65)}
canvas{display:block}
</style>
</head>
<body>
<div class="lbl">Tap or Space to Jump</div>
<div class="phone"><canvas id="c" width="286" height="586"></canvas></div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=286,H=586;

// ── EXACT ORIGINAL FLAPPY BIRD PHYSICS (from video analysis) ──
// Video: screen ~720x1602px actual game area ~720x1400px
// Ratio to our canvas: W/720 = 0.397, H/586 ~ scaled
// Pipe gap: ~35% of screen height → 130-135px here
// Pipe width: ~10% of screen width → 54px here  
// Bird size: ~8% screen width → ~28px here
// Pipe speed: moderate → 2.2 px/frame
// Gravity: feels like 0.38, jump = -8.5
// Pipe spawn: every ~90 frames

const PHYSICS={
  gravity:0.38,
  jump:-8.5,
  pipeSpeed:2.2,
  pipeInterval:88,
  pipeWidth:54,
  pipeGap:138,  // gap between top and bottom pipe
  birdX:72,     // bird fixed X position (left side like original)
};

const COLLEGES=['A.N. College','ANS College','B.D. College','B.S. College',
  'Commerce Arts & Sci','G.J. College','Ganga Devi Mahila',"J.D. Women's College",
  'J.N.L. College','L.P. Shahi College','M.M. College','Mahila College',
  'R.K.D. College','R.L.S.Y. College','RPM College','Ram Ratan Singh',
  'S.G.G.S. College','S.M.D. College','Sri Arvind Mahila','T.P.S. College',
  'Kisan College','Nalanda College','Nalanda Mahila','R.L.S.Y. Nalanda','S.U. College'];

const BOOKS=[
  {bg:'#2c4fa3',sp:'#1a3278',hl:'#4a6fc0',tx:'Physics'},
  {bg:'#b52b27',sp:'#801e1b',hl:'#d44440',tx:'History'},
  {bg:'#1e8a4a',sp:'#125e30',hl:'#30b060',tx:'Math'},
  {bg:'#c06010',sp:'#904008',hl:'#e07828',tx:'Law'},
  {bg:'#7030a0',sp:'#501878',hl:'#9050c0',tx:'Chemistry'},
  {bg:'#0e7868',sp:'#085048',hl:'#20a090',tx:'Biology'},
  {bg:'#1a68a8',sp:'#0e4878',hl:'#2880c8',tx:'English'},
  {bg:'#b04010',sp:'#802808',hl:'#d05828',tx:'Economics'},
  {bg:'#2a5878',sp:'#183858',hl:'#3878a8',tx:'Pol. Sci.'},
  {bg:'#805820',sp:'#583808',hl:'#a07030',tx:'Sanskrit'},
];

// State
let state='idle',score=0,best=0,fr=0;

// Bird — exact position like original (left-center)
const bird={
  x:PHYSICS.birdX,
  y:H*0.42,  // start slightly above center like original
  vy:0,
  sp:[]  // sparkles
};

// Pipes
let pipes=[];
let pTimer=0;

// Background scroll (right to left)
let bgScroll=0;
const BGS=1.0;

// Ground scroll
let groundScroll=0;

// Ground height — exact like original (~15% of screen)
const GROUND_H=80;

// Pre-generate 25 college buildings
const BLDG_SPACING=240;
const bldgs=COLLEGES.map((name,i)=>{
  const s=i*137.508+1;
  return {
    name,
    ox:i*BLDG_SPACING,
    w:90+((s*13)%90),
    h:95+((s*7)%145),
    style:i%4,
    hue:210+((i*23)%50),
    sat:15+((i*7)%15),
    wCols:Math.max(2,Math.floor((90+((s*13)%90))/22)),
    wRows:Math.max(2,Math.floor((95+((s*7)%145))/28)),
    lit:Array.from({length:24},()=>Math.random()>0.35)
  };
});

// ── INPUT ──
function tap(){
  if(state==='idle'||state==='dead'){start();return;}
  flap();
}
C.addEventListener('click',tap);
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){e.preventDefault();tap();}
});

function start(){
  bird.y=H*0.42; bird.vy=0; bird.sp=[];
  pipes=[]; pTimer=0; score=0; fr=0;
  bgScroll=0; groundScroll=0;
  state='playing';
}

function flap(){
  bird.vy=PHYSICS.jump;
  // Wing flap sparkles
  for(let i=0;i<10;i++){
    bird.sp.push({
      x:bird.x-22,y:bird.y+(Math.random()-0.5)*18,
      vx:-(Math.random()*3.5+1.5),vy:(Math.random()-0.5)*3,
      s:Math.random()*5+2,a:1,
      c:['#FFD700','#fff','#a0b4ff','#5B5BD6','#ff9900','#80ffb0'][Math.floor(Math.random()*6)],
      star:Math.random()>0.4
    });
  }
}

function spawnPipe(){
  // Min top height = 60px, max = H - GROUND_H - GAP - 60px
  const minTop=60;
  const maxTop=H-GROUND_H-PHYSICS.pipeGap-60;
  const topH=Math.random()*(maxTop-minTop)+minTop;
  const mk=()=>{
    const a=[];const n=10+Math.floor(Math.random()*5);
    for(let i=0;i<n;i++) a.push(BOOKS[Math.floor(Math.random()*BOOKS.length)]);
    return a;
  };
  pipes.push({
    x:W+10,
    topH,
    botY:topH+PHYSICS.pipeGap,
    scored:false,
    bT:mk(),bB:mk()
  });
}

// ════════════════════════════════════════
// DRAW: SKY
// ════════════════════════════════════════
function drawSky(){
  const sky=ctx.createLinearGradient(0,0,0,H-GROUND_H);
  sky.addColorStop(0,'#74b9ea');
  sky.addColorStop(.38,'#a9d7f2');
  sky.addColorStop(.72,'#d5edf6');
  sky.addColorStop(1,'#edf7f7');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H-GROUND_H);

  // soft atmospheric glow
  const glow=ctx.createRadialGradient(W*.72,H*.15,5,W*.72,H*.15,145);
  glow.addColorStop(0,'rgba(255,255,225,.9)');
  glow.addColorStop(.28,'rgba(255,247,205,.35)');
  glow.addColorStop(1,'rgba(255,247,205,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H-GROUND_H);

  // distant mountains
  ctx.fillStyle='rgba(91,135,157,.22)';
  ctx.beginPath();ctx.moveTo(0,H-GROUND_H-62);ctx.lineTo(38,H-GROUND_H-112);ctx.lineTo(74,H-GROUND_H-74);
  ctx.lineTo(116,H-GROUND_H-130);ctx.lineTo(166,H-GROUND_H-72);ctx.lineTo(205,H-GROUND_H-108);
  ctx.lineTo(286,H-GROUND_H-58);ctx.lineTo(286,H-GROUND_H);ctx.lineTo(0,H-GROUND_H);ctx.closePath();ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.beginPath();ctx.moveTo(0,H-GROUND_H-44);ctx.lineTo(52,H-GROUND_H-82);ctx.lineTo(91,H-GROUND_H-48);
  ctx.lineTo(126,H-GROUND_H-92);ctx.lineTo(172,H-GROUND_H-46);ctx.lineTo(210,H-GROUND_H-75);
  ctx.lineTo(286,H-GROUND_H-38);ctx.lineTo(286,H-GROUND_H);ctx.lineTo(0,H-GROUND_H);ctx.closePath();ctx.fill();
}

function drawClouds(){
  for(let i=0;i<7;i++){
    const cx=((W+120-(bgScroll*.22+i*108))%(W+240)+W+240)%(W+240)-60;
    const cy=30+i*28;
    const cw=26+i*5,ch=10+i*1.8;
    ctx.save();
    ctx.shadowColor='rgba(58,91,112,.12)';ctx.shadowBlur=7;ctx.shadowOffsetY=4;
    const cg=ctx.createLinearGradient(cx,cy-ch,cx,cy+ch);
    cg.addColorStop(0,'rgba(255,255,255,.98)');cg.addColorStop(1,'rgba(218,238,248,.86)');
    ctx.fillStyle=cg;
    ctx.beginPath();ctx.ellipse(cx,cy,cw,ch,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx-cw*.42,cy+2,cw*.5,ch*.72,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+cw*.38,cy+3,cw*.46,ch*.66,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

// ════════════════════════════════════════
// DRAW: BUILDINGS (25 colleges, right→left)
// ════════════════════════════════════════
function drawBuilding(b,sx){
  if(sx+b.w<-20||sx>W+20)return;
  const groundY=H-GROUND_H,by=groundY-b.h;
  ctx.save();

  // soft clay shadow
  ctx.fillStyle='rgba(40,63,74,.13)';
  ctx.beginPath();ctx.ellipse(sx+b.w*.52+7,groundY+1,b.w*.56,7,0,0,Math.PI*2);ctx.fill();

  // side depth
  const side=`hsl(${b.hue},${b.sat}%,${Math.max(48,66-b.style*2)}%)`;
  ctx.fillStyle=side;
  ctx.beginPath();ctx.moveTo(sx+b.w,by+3);ctx.lineTo(sx+b.w+11,by-2);ctx.lineTo(sx+b.w+11,groundY-3);ctx.lineTo(sx+b.w,groundY);ctx.closePath();ctx.fill();

  // roof slab
  ctx.fillStyle=`hsl(${b.hue},${b.sat+6}%,76%)`;
  ctx.beginPath();ctx.roundRect(sx-3,by-5,b.w+6,8,3);ctx.fill();

  // front clay body
  const fg=ctx.createLinearGradient(sx,by,sx+b.w,groundY);
  fg.addColorStop(0,`hsl(${b.hue},${Math.max(8,b.sat-3)}%,94%)`);
  fg.addColorStop(.45,`hsl(${b.hue},${Math.max(8,b.sat-4)}%,89%)`);
  fg.addColorStop(1,`hsl(${b.hue},${Math.max(8,b.sat-2)}%,80%)`);
  ctx.fillStyle=fg;
  ctx.shadowColor='rgba(41,69,88,.14)';ctx.shadowBlur=7;ctx.shadowOffsetY=3;
  ctx.beginPath();ctx.roundRect(sx,by,b.w,b.h,4);ctx.fill();
  ctx.shadowColor='transparent';

  // window grid with recessed clay frames
  const fH=b.h/b.wRows;
  const wW=Math.max(7,(b.w-14)/b.wCols-4),wH=Math.max(7,fH*.47);
  for(let r=0;r<b.wRows;r++)for(let wc=0;wc<b.wCols;wc++){
    const wx=sx+7+wc*((b.w-14)/b.wCols)+1, wy=by+9+r*fH+fH*.16;
    if(wx+wW>sx+b.w-4||wy+wH>groundY-5)continue;
    const lit=b.lit[(r*b.wCols+wc)%b.lit.length];
    ctx.fillStyle=lit?'rgba(176,222,245,.9)':'rgba(86,113,126,.26)';
    ctx.shadowColor='rgba(40,70,86,.16)';ctx.shadowBlur=3;ctx.shadowOffsetY=2;
    ctx.beginPath();ctx.roundRect(wx,wy,wW,wH,2);ctx.fill();
    ctx.shadowColor='transparent';
    ctx.strokeStyle='rgba(255,255,255,.58)';ctx.lineWidth=.7;ctx.stroke();
    if(lit){ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(wx+1,wy+1,wW*.55,1.2);}
  }

  // entrance
  const dW=18,dH=24,dx=sx+b.w/2-dW/2,dy=groundY-dH;
  const dg=ctx.createLinearGradient(dx,dy,dx+dW,dy+dH);
  dg.addColorStop(0,'#526c78');dg.addColorStop(1,'#263d49');
  ctx.fillStyle=dg;ctx.beginPath();ctx.roundRect(dx,dy,dW,dH,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(dx+3,dy+3,2,dH-6);

  // roof variants
  if(b.style===2){
    ctx.fillStyle=`hsl(${b.hue},${b.sat+4}%,72%)`;
    ctx.beginPath();ctx.moveTo(sx+b.w*.25,by);ctx.lineTo(sx+b.w*.5,by-28);ctx.lineTo(sx+b.w*.75,by);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.moveTo(sx+b.w*.5,by-28);ctx.lineTo(sx+b.w*.75,by);ctx.lineTo(sx+b.w*.5,by-22);ctx.closePath();ctx.fill();
  }else if(b.style===3){
    ctx.fillStyle=`hsl(${b.hue},${b.sat+5}%,75%)`;
    ctx.beginPath();ctx.ellipse(sx+b.w/2,by,b.w*.32,16,0,Math.PI,0);ctx.fill();
  }

  // sign board
  const nbW=Math.min(b.w+8,104),nbH=16,nbX=sx+b.w/2-nbW/2,nbY=dy-22;
  ctx.shadowColor='rgba(35,55,68,.18)';ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  ctx.fillStyle='rgba(248,252,254,.96)';ctx.beginPath();ctx.roundRect(nbX,nbY,nbW,nbH,4);ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='#5b5bd6';ctx.fillRect(nbX,nbY,nbW,3);
  ctx.fillStyle='#32445b';ctx.font=`800 ${Math.max(4.5,Math.min(7,nbW/b.name.length*1.42))}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.name,sx+b.w/2,nbY+10);

  ctx.restore();
}

// ════════════════════════════════════════
// DRAW: GROUND (exactly like original Flappy Bird style)
// ════════════════════════════════════════
function drawGround(){
  const gy=H-GROUND_H;
  const grass=ctx.createLinearGradient(0,gy,0,gy+24);
  grass.addColorStop(0,'#a6d96f');grass.addColorStop(.35,'#75b95a');grass.addColorStop(1,'#4f8e45');
  ctx.fillStyle=grass;ctx.fillRect(0,gy,W,24);

  const dirt=ctx.createLinearGradient(0,gy+24,0,H);
  dirt.addColorStop(0,'#d9c09a');dirt.addColorStop(.55,'#b4936d');dirt.addColorStop(1,'#876e55');
  ctx.fillStyle=dirt;ctx.fillRect(0,gy+24,W,H-gy-24);

  // rounded grass lip
  ctx.fillStyle='rgba(220,250,184,.55)';ctx.fillRect(0,gy,W,3);
  ctx.fillStyle='rgba(54,102,44,.35)';ctx.fillRect(0,gy+21,W,3);

  // moving stones and soft terrain marks
  for(let i=0;i<13;i++){
    const px=((i*31-groundScroll*.75)%(W+35)+W+35)%(W+35)-18;
    ctx.fillStyle='rgba(104,78,54,.18)';
    ctx.beginPath();ctx.ellipse(px,gy+35+(i%4)*9,4+(i%3),2.2,0,0,Math.PI*2);ctx.fill();
  }
}

// ════════════════════════════════════════
// DRAW: 3D BOOK PILLAR
// ════════════════════════════════════════
function shd(hex,amt){
  const n=parseInt((hex||'#888888').replace('#',''),16)||0;
  return `rgb(${Math.max(0,Math.min(255,(n>>16)+amt))},${Math.max(0,Math.min(255,((n>>8)&255)+amt))},${Math.max(0,Math.min(255,(n&255)+amt))})`;
}
function lighten(hex){return shd(hex,40);}

function drawBook(x,y,w,h,bk){
  if(h<3)return;
  ctx.save();

  // cast shadow
  ctx.fillStyle='rgba(23,35,45,.18)';
  ctx.beginPath();ctx.ellipse(x+w*.58,y+h,w*.58,2.4,0,0,Math.PI*2);ctx.fill();

  // pages/depth
  const pg=ctx.createLinearGradient(x+w,y,x+w+7,y);
  pg.addColorStop(0,'#f8f4e9');pg.addColorStop(.5,'#d9d5c9');pg.addColorStop(1,'#aaa79d');
  ctx.fillStyle=pg;ctx.fillRect(x+w-1,y+2,7,Math.max(1,h-3));
  ctx.strokeStyle='rgba(100,90,70,.2)';ctx.lineWidth=.35;
  for(let py=y+3;py<y+h;py+=2){ctx.beginPath();ctx.moveTo(x+w,py);ctx.lineTo(x+w+6,py);ctx.stroke();}

  // rounded clay cover
  const g=ctx.createLinearGradient(x,y,x+w,y+h);
  g.addColorStop(0,bk.hl||lighten(bk.bg));g.addColorStop(.18,bk.bg);g.addColorStop(.78,bk.bg);g.addColorStop(1,shd(bk.bg,-30));
  ctx.fillStyle=g;ctx.shadowColor='rgba(30,45,55,.22)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  ctx.beginPath();ctx.roundRect(x,y,w,h,3);ctx.fill();
  ctx.shadowColor='transparent';

  // spine
  const sg=ctx.createLinearGradient(x,y,x+7,y);
  sg.addColorStop(0,bk.sp);sg.addColorStop(.55,bk.bg);sg.addColorStop(1,shd(bk.sp,-18));
  ctx.fillStyle=sg;ctx.beginPath();ctx.roundRect(x,y,8,h,3);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+1,y+1,1.5,Math.max(1,h-2));

  // cover sheen
  const sheen=ctx.createLinearGradient(x,y,x,y+h*.42);
  sheen.addColorStop(0,'rgba(255,255,255,.34)');sheen.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sheen;ctx.beginPath();ctx.roundRect(x+8,y+1,w-9,Math.max(2,h*.42),2);ctx.fill();

  if(h>10){
    const lw=w*.67,lh=Math.min(h-5,11),lx=x+w*.18,ly=y+(h-lh)/2;
    ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.roundRect(lx,ly,lw,lh,2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.94)';
    ctx.font=`800 ${Math.min(7,lw*.9/bk.tx.length*1.5)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(bk.tx.substring(0,8),x+w/2+3,y+h/2);
  }

  // dimensional top face
  if(y>2){
    ctx.fillStyle=lighten(bk.bg);
    ctx.beginPath();ctx.moveTo(x+2,y);ctx.lineTo(x+w-1,y);ctx.lineTo(x+w+6,y-3);ctx.lineTo(x+7,y-3);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.fill();
  }
  ctx.restore();
}

function drawPillar(x,y0,y1,books){
  const BH=21;let by=y0,bi=0;
  while(by+BH<=y1){drawBook(x,by,PHYSICS.pipeWidth,BH,books[bi%books.length]);by+=BH;bi++;}
  if(by<y1&&by>=y0)drawBook(x,by,PHYSICS.pipeWidth,y1-by,books[bi%books.length]);

  // rounded end cap with bevel
  const capY=y1-1,capW=PHYSICS.pipeWidth+10;
  ctx.save();
  ctx.shadowColor='rgba(24,35,44,.2)';ctx.shadowBlur=5;ctx.shadowOffsetY=2;
  const cg=ctx.createLinearGradient(x-5,capY,x+PHYSICS.pipeWidth+5,capY+7);
  cg.addColorStop(0,'#eef3f5');cg.addColorStop(.18,'#b9c5cc');cg.addColorStop(.55,'#73838d');cg.addColorStop(1,'#4a5962');
  ctx.fillStyle=cg;ctx.beginPath();ctx.roundRect(x-5,capY,capW,7,3);ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.roundRect(x-3,capY+1,capW-5,1.5,1);ctx.fill();
  ctx.restore();
}

// ════════════════════════════════════════
// DRAW: NOTEBOOK BIRD (graduation cap, eyes, diploma, wings)
// ════════════════════════════════════════
function drawBird(){
  const {x,y,sp,vy}=bird;
  sp.forEach(s=>{
    ctx.globalAlpha=s.a;ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s*.72,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  });

  const tilt=Math.max(-.48,Math.min(.6,vy*.048));
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);

  // soft contact shadow
  ctx.fillStyle='rgba(20,40,50,.16)';ctx.beginPath();ctx.ellipse(2,29,19,4.5,0,0,Math.PI*2);ctx.fill();

  const wf=Math.sin(fr*.34)*.72;
  function wing(side){
    ctx.save();ctx.translate(side*18,3);ctx.rotate(side*(wf+.35));
    const wg=ctx.createLinearGradient(0,-8,0,11);
    wg.addColorStop(0,'#ffffff');wg.addColorStop(.5,'#dceaf1');wg.addColorStop(1,'#9eb8c5');
    ctx.fillStyle=wg;ctx.shadowColor='rgba(39,65,78,.18)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
    ctx.beginPath();
    if(side<0){ctx.moveTo(0,0);ctx.bezierCurveTo(-8,-10,-22,-8,-25,1);ctx.bezierCurveTo(-21,12,-8,11,0,5);}
    else{ctx.moveTo(0,0);ctx.bezierCurveTo(8,-10,22,-8,25,1);ctx.bezierCurveTo(21,12,8,11,0,5);}
    ctx.closePath();ctx.fill();ctx.shadowColor='transparent';
    ctx.strokeStyle='rgba(69,94,107,.28)';ctx.lineWidth=.8;ctx.stroke();
    ctx.restore();
  }
  wing(-1);wing(1);

  // body
  const body=ctx.createRadialGradient(-7,-8,2,2,3,25);
  body.addColorStop(0,'#fff');body.addColorStop(.45,'#e8f0f3');body.addColorStop(.82,'#b8cbd4');body.addColorStop(1,'#718b97');
  ctx.fillStyle=body;ctx.shadowColor='rgba(25,49,61,.25)';ctx.shadowBlur=7;ctx.shadowOffsetY=4;
  ctx.beginPath();ctx.ellipse(0,0,18,17,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';

  // warm belly patch
  const belly=ctx.createRadialGradient(1,4,1,1,5,14);
  belly.addColorStop(0,'#fff9d9');belly.addColorStop(1,'#e5c86b');
  ctx.fillStyle=belly;ctx.beginPath();ctx.ellipse(4,6,10,9,0,0,Math.PI*2);ctx.fill();

  // tail feathers
  ctx.fillStyle='#94adba';ctx.beginPath();ctx.moveTo(-14,4);ctx.lineTo(-25,-2);ctx.lineTo(-20,8);ctx.lineTo(-28,12);ctx.lineTo(-13,13);ctx.closePath();ctx.fill();

  // graduation cap
  ctx.fillStyle='#29343d';ctx.shadowColor='rgba(20,25,30,.22)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
  ctx.beginPath();ctx.roundRect(-11,-25,22,7,2);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-18,13,4.4,0,0,Math.PI*2);ctx.fill();ctx.shadowColor='transparent';
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(-8,-24,15,1.2);

  // tassel
  ctx.strokeStyle='#e9b93f';ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(8,-23);ctx.lineTo(15,-16);ctx.lineTo(15,-10);ctx.stroke();
  ctx.fillStyle='#f4cc55';ctx.beginPath();ctx.arc(15,-8,3.3,0,Math.PI*2);ctx.fill();
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(15,-5);ctx.lineTo(14+i*2,0);ctx.stroke();}

  // eye with glassy highlight
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-3,6.4,6.6,0,0,Math.PI*2);ctx.fill();
  const iris=ctx.createRadialGradient(8,-3,0,8,-3,4.2);
  iris.addColorStop(0,'#63b6d8');iris.addColorStop(.55,'#236a91');iris.addColorStop(1,'#12374e');
  ctx.fillStyle=iris;ctx.beginPath();ctx.arc(8,-3,3.7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#101c24';ctx.beginPath();ctx.arc(8.4,-3,2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='white';ctx.beginPath();ctx.arc(9.3,-4.1,1.3,0,Math.PI*2);ctx.fill();

  // beak
  const bk=ctx.createLinearGradient(17,-1,25,6);
  bk.addColorStop(0,'#ffe889');bk.addColorStop(.5,'#e5a52b');bk.addColorStop(1,'#9a5c0b');
  ctx.fillStyle=bk;ctx.beginPath();ctx.moveTo(17,-2);ctx.lineTo(25,2);ctx.lineTo(17,7);ctx.closePath();ctx.fill();

  // diploma
  ctx.save();ctx.translate(12,8);ctx.rotate(.3);
  ctx.fillStyle='#fffaf0';ctx.shadowColor='rgba(50,40,25,.16)';ctx.shadowBlur=3;ctx.shadowOffsetY=2;
  ctx.beginPath();ctx.roundRect(-7,-5,14,10,4);ctx.fill();ctx.shadowColor='transparent';
  ctx.strokeStyle='#c74c43';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(0,-5);ctx.lineTo(0,5);ctx.stroke();ctx.restore();

  ctx.restore();
}

// ════════════════════════════════════════
// UI OVERLAYS
// ════════════════════════════════════════
function drawHUD(){
  // Score pill top-left (exactly like original)
  ctx.fillStyle='rgba(255,255,255,0.92)';ctx.strokeStyle='rgba(91,91,214,0.18)';ctx.lineWidth=1;
  ctx.beginPath();ctx.roundRect(10,10,98,30,15);ctx.fill();ctx.stroke();
  ctx.fillStyle='#5B5BD6';ctx.font='bold 14px sans-serif';
  ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText('Score: '+score,20,25);
  if(best>0){
    ctx.fillStyle='rgba(255,255,255,0.88)';ctx.beginPath();ctx.roundRect(W-80,10,70,26,13);ctx.fill();
    ctx.fillStyle='#8888aa';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText('Best: '+best,W-45,23);
  }
}

function cardBG(x,y,w,h,r){
  ctx.fillStyle='rgba(255,255,255,0.97)';ctx.strokeStyle='rgba(91,91,214,0.13)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();
}
function gradBtn(cx,cy,w,h,r,txt){
  const g=ctx.createLinearGradient(cx-w/2,0,cx+w/2,0);
  g.addColorStop(0,'#5B5BD6');g.addColorStop(1,'#4A90D9');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(cx-w/2,cy-h/2,w,h,r);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.14)';ctx.beginPath();ctx.roundRect(cx-w/2+2,cy-h/2+2,w-4,h/2-2,r-1);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,cx,cy);
}

function drawIdle(){
  ctx.fillStyle='rgba(228,238,255,0.62)';ctx.fillRect(0,0,W,H);
  cardBG(W/2-110,H/2-115,220,205,24);
  ctx.font='38px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎓',W/2,H/2-80);
  ctx.fillStyle='#5B5BD6';ctx.font='bold 21px sans-serif';ctx.fillText('Flappy Notebook',W/2,H/2-44);
  ctx.fillStyle='#6b6b8a';ctx.font='11px sans-serif';ctx.fillText('Fly through College Books!',W/2,H/2-20);
  ctx.fillStyle='#9999bb';ctx.font='10px sans-serif';ctx.fillText('Tap • Avoid book pillars',W/2,H/2+0);
  const p=0.94+Math.sin(fr*0.07)*0.06;
  ctx.save();ctx.translate(W/2,H/2+32);ctx.scale(p,p);gradBtn(0,0,136,36,18,'🚀  Tap to Start!');ctx.restore();
  if(best>0){
    ctx.fillStyle='rgba(255,215,0,0.1)';ctx.strokeStyle='rgba(255,200,0,0.45)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(W/2-45,H/2+60,90,24,12);ctx.fill();ctx.stroke();
    ctx.fillStyle='#aa8800';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('🏆 Best: '+best,W/2,H/2+72);
  }
}

function drawDead(){
  ctx.fillStyle='rgba(225,235,255,0.8)';ctx.fillRect(0,0,W,H);
  cardBG(W/2-118,H/2-128,236,250,26);
  ctx.font='30px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💥',W/2,H/2-96);
  ctx.fillStyle='#1a1a3a';ctx.font='bold 20px sans-serif';ctx.fillText('Game Over!',W/2,H/2-65);
  ctx.fillStyle='rgba(91,91,214,0.07)';ctx.beginPath();ctx.arc(W/2,H/2-28,38,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(91,91,214,0.18)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle='#5B5BD6';ctx.font='bold 44px sans-serif';ctx.fillText(score,W/2,H/2-25);
  ctx.fillStyle='#8888aa';ctx.font='10px sans-serif';ctx.fillText('SCORE',W/2,H/2+8);
  if(score>=best&&score>0){ctx.fillStyle='#cc9900';ctx.font='bold 13px sans-serif';ctx.fillText('🏆 New Best Score!',W/2,H/2+28);}
  else if(best>0){ctx.fillStyle='#8888aa';ctx.font='11px sans-serif';ctx.fillText('Best: '+best,W/2,H/2+28);}
  gradBtn(W/2,H/2+56,138,38,19,'↺  Restart');
  ctx.fillStyle='rgba(255,215,0,0.09)';ctx.strokeStyle='rgba(255,200,0,0.48)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(W/2-68,H/2+98,136,36,18);ctx.fill();ctx.stroke();
  ctx.fillStyle='#996600';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('▶ Watch Ad to Revive ✨',W/2,H/2+116);
}

// ════════════════════════════════════════
// COLLISION
// ════════════════════════════════════════
function hit(){
  const r=12;
  if(bird.y+r>=H-GROUND_H||bird.y-r<=0) return true;
  for(const p of pipes){
    if(bird.x+r>p.x&&bird.x-r<p.x+PHYSICS.pipeWidth){
      if(bird.y-r<p.topH||bird.y+r>p.botY) return true;
    }
  }
  return false;
}

// ════════════════════════════════════════
// MAIN LOOP
// ════════════════════════════════════════
function loop(){
  requestAnimationFrame(loop);
  fr++;

  // Scroll
  if(state==='playing'){
    bgScroll+=BGS;
    groundScroll+=PHYSICS.pipeSpeed;
  }

  // Update sparkles
  bird.sp=bird.sp.filter(s=>{
    s.x+=s.vx;s.y+=s.vy;s.a-=0.055;s.s*=0.93;return s.a>0.02;
  });
  // Continuous trail while alive
  if(state==='playing'&&fr%3===0){
    bird.sp.push({
      x:bird.x-24,y:bird.y+(Math.random()-0.5)*12,
      vx:-(Math.random()*2.2+1),vy:(Math.random()-0.5)*1.3,
      s:Math.random()*2.5+1,a:0.65,
      c:['rgba(91,91,214,0.75)','rgba(255,215,0,0.85)','rgba(180,200,255,0.7)'][Math.floor(Math.random()*3)],
      star:false
    });
  }

  if(state==='playing'){
    // Physics — exact original feel
    bird.vy+=PHYSICS.gravity;
    bird.y+=bird.vy;

    // Spawn pipes
    if(++pTimer>=PHYSICS.pipeInterval){spawnPipe();pTimer=0;}

    // Move pipes right to left
    pipes.forEach(p=>p.x-=PHYSICS.pipeSpeed);
    pipes=pipes.filter(p=>p.x+PHYSICS.pipeWidth>-10);

    // Score
    pipes.forEach(p=>{
      if(!p.scored&&p.x+PHYSICS.pipeWidth<bird.x){
        p.scored=true;score++;if(score>best)best=score;
      }
    });

    if(hit()) state='dead';
  }

  // ── DRAW ──
  drawSky();
  drawClouds();

  // Buildings (25 colleges, RIGHT TO LEFT)
  const totalBW=COLLEGES.length*BLDG_SPACING;
  const ox=(bgScroll*0.82)%totalBW;
  for(let rep=0;rep<3;rep++){
    bldgs.forEach(b=>{
      drawBuilding(b, b.ox-ox+rep*totalBW);
    });
  }

  drawGround();

  // Book pillars
  pipes.forEach(p=>{
    if(p.topH>3) drawPillar(p.x,0,p.topH,p.bT);
    if(p.botY<H-GROUND_H) drawPillar(p.x,p.botY,H-GROUND_H,p.bB);
  });

  drawBird();

  // soft screen depth/vignette
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.72);
  vg.addColorStop(.65,'rgba(255,255,255,0)');
  vg.addColorStop(1,'rgba(24,45,58,.12)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

  if(state==='playing'||state==='dead') drawHUD();
  if(state==='idle') drawIdle();
  if(state==='dead') drawDead();
}

loop();
</script>
